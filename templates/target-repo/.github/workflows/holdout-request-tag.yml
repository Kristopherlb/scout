name: holdout-request-tag

# Transport shim for LFD holdout requests.
#
# If the caller cannot push tags, request-holdout-check.sh pushes a single
# append-only request commit on an ephemeral lfd-request/<id> branch. The
# checked-in materializer validates the branch, parent, diff, payload, and tag;
# creates the immutable tag; then deletes the remote request branch.

on:
  push:
    branches:
      - "lfd-request/**"
    paths:
      - ".github/holdout-requests.jsonl"

permissions:
  contents: write     # required to create tag refs

concurrency:
  group: holdout-request-tag
  cancel-in-progress: false   # serialize; concurrent tag creation would race

jobs:
  create-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # the target commit must be reachable, not just the tip

      - name: Validate and materialize the holdout request
        run: |
          set -euo pipefail
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          python3 scripts/target-repo/materialize-holdout-request.py \
            --event-sha "$GITHUB_SHA" --event-ref "$GITHUB_REF"
